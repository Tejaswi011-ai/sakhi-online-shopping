<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Sakhi</title>
  <link rel="stylesheet" href="st.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <img src="logo.jpeg" alt="Sakhi Logo">
      <h1>Sakhi</h1>
    </div>
  </header>

  <section class="auth-section" style="text-align: center; padding: 50px 20px;">
    <div id="login-container">
      <h2>Login</h2>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required><br><br>
        <input type="password" id="login-password" placeholder="Password" required><br><br>
        <button type="submit" class="btn">Login</button>
      </form>
      <p style="margin-top: 20px;">Don't have an account? <a href="#" onclick="toggleAuth('signup')">Sign up here</a></p>
    </div>

    <div id="signup-container" style="display: none;">
      <h2>Create Account</h2>
      <form id="signup-form">
        <input type="text" id="signup-name" placeholder="Full Name" required><br><br>
        <input type="email" id="signup-email" placeholder="Email" required><br><br>
        <input type="password" id="signup-password" placeholder="Password" required><br><br>
        <button type="submit" class="btn">Sign Up</button>
      </form>
      <p style="margin-top: 20px;">Already have an account? <a href="#" onclick="toggleAuth('login')">Login here</a></p>
    </div>
  </section>

  <script>
    function toggleAuth(type) {
      if (type === 'signup') {
        document.getElementById('login-container').style.display = 'none';
        document.getElementById('signup-container').style.display = 'block';
      } else {
        document.getElementById('login-container').style.display = 'block';
        document.getElementById('signup-container').style.display = 'none';
      }
    }
  </script>

  <footer class="footer">
    <p>© 2025 Sakhi. All rights reserved.</p>
  </footer>

  <script src="js/products.js"></script><script src="js/auth.js"></script><script src="js/recommendations.js"></script><script src="js/ai-assistant.js"></script><script src="js/viewer360.js"></script><script src="js/sakhi.js"></script>
</body>
</html>
